name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Buildozer and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libsdl2-dev
        pip install --upgrade pip
        pip install buildozer cython

    - name: Initialize Buildozer
      run: |
        buildozer init
        # Меняем название пакета и отключаем aab, чтобы собирался именно apk
        sed -i 's/#title = My Application/title = Gym Tracker Pro/' buildozer.spec
        sed -i 's/#package.name = myapp/package.name = gymtracker/' buildozer.spec
        sed -i 's/requirements = python3,kivy/requirements = python3,flet,certifi/' buildozer.spec
        sed -i 's/#android.ndk =/android.ndk = 25b/' buildozer.spec

    - name: Build with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
